<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>GymGuide</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f8fafc}
.app{max-width:900px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:27px;font-weight:900}.logo span{color:#60a5fa}.sub{color:#94a3b8;font-size:13px;margin-top:3px}
button,input,select{font:inherit}button{border:0;cursor:pointer}.iconbtn{background:#1e293b;color:white;border-radius:12px;padding:11px 13px}
.hero{background:linear-gradient(135deg,#172554,#1e3a8a);border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px #0004}
.hero h1{margin:0 0 8px;font-size:25px}.hero p{margin:0;color:#cbd5e1}.search{margin-top:16px;width:100%;padding:14px 16px;border-radius:14px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 11px}.section-title h2{font-size:18px;margin:0}.count{color:#94a3b8;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{white-space:nowrap;background:#1e293b;color:#cbd5e1;padding:9px 13px;border-radius:999px}.chip.active{background:#3b82f6;color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#111827;border:1px solid #1f2937;border-radius:18px;overflow:hidden;position:relative}.cardbody{padding:14px}.card h3{font-size:16px;margin:0 0 6px}.meta{font-size:12px;color:#94a3b8}.tag{display:inline-block;margin-top:9px;background:#172554;color:#93c5fd;border-radius:8px;padding:5px 8px;font-size:11px}
.demo{height:150px;background:linear-gradient(180deg,#1e293b,#0f172a);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.floor{position:absolute;bottom:28px;width:70%;height:2px;background:#475569}.person{position:relative;width:70px;height:105px;animation:move 3.8s ease-in-out infinite}.head{position:absolute;width:20px;height:20px;border:4px solid #e2e8f0;border-radius:50%;left:25px;top:3px}.bodyline{position:absolute;width:4px;height:43px;background:#60a5fa;left:33px;top:23px;border-radius:4px}.arm,.leg{position:absolute;width:4px;background:#cbd5e1;border-radius:4px;transform-origin:top}.arm{height:32px;top:27px}.a1{left:33px;transform:rotate(65deg);animation:arm1 3.8s infinite}.a2{left:33px;transform:rotate(-65deg);animation:arm2 3.8s infinite}.leg{height:39px;top:62px}.l1{left:33px;transform:rotate(25deg);animation:leg1 3.8s infinite}.l2{left:33px;transform:rotate(-25deg);animation:leg2 3.8s infinite}
@keyframes move{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}@keyframes arm1{0%,100%{transform:rotate(55deg)}50%{transform:rotate(105deg)}}@keyframes arm2{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(-15deg)}}@keyframes leg1{0%,100%{transform:rotate(20deg)}50%{transform:rotate(5deg)}}@keyframes leg2{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-5deg)}}
.star{position:absolute;right:10px;top:10px;background:#0f172acc;color:#fbbf24;border-radius:10px;padding:8px;z-index:2}
.empty{padding:30px;text-align:center;color:#94a3b8;background:#111827;border-radius:16px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f172af2;border-top:1px solid #1f2937;display:flex;justify-content:center;gap:6px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{background:none;color:#94a3b8;padding:8px 16px;border-radius:12px}.nav.active{color:white;background:#1e293b}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#0f172a;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 35px}.close{float:right;background:#1e293b;color:white;border-radius:10px;padding:8px 11px}.sheet h2{margin:8px 0}.steps li{margin:10px 0;color:#cbd5e1}.log{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}.log input{min-width:0;background:#111827;border:1px solid #334155;color:white;border-radius:10px;padding:10px}.add{background:#2563eb;color:white;border-radius:10px;padding:10px 13px}.sets{margin-top:12px}.setrow{display:flex;justify-content:space-between;background:#111827;padding:10px;border-radius:10px;margin-top:6px;color:#cbd5e1}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.demo{height:170px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="logo">Gym<span>Guide</span> 💪</div><div class="sub">Your free gym exercise companion</div></div><button class="iconbtn" onclick="showFavourites()">⭐</button></header>
<section class="hero"><h1>Find your next exercise</h1><p>Learn the machine, movement, muscles and technique.</p><input id="search" class="search" placeholder="Search exercise or machine..." oninput="render()"></section>
<div id="content"></div>
</div>
<nav class="bottom"><button class="nav active" onclick="home()">🏠 Home</button><button class="nav" onclick="showFavourites()">⭐ Favourites</button><button class="nav" onclick="showWorkout()">📋 Workout</button></nav>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>

<script>
const exercises=[
["Chest","Chest Press Machine","Machine","Chest, Triceps","Push","Sit with your back flat against the pad. Adjust the seat so the handles are level with mid-chest. Push smoothly, then return under control.","3 x 8–12"],
["Chest","Pec Deck / Chest Fly","Machine","Chest","Fly","Set the seat so handles are around chest height. Bring the handles together without shrugging, then slowly open.","3 x 10–15"],
["Chest","Incline Dumbbell Press","Dumbbells","Upper Chest, Triceps","Push","Set an incline bench. Start dumbbells beside your upper chest, press upward, then lower slowly.","3 x 8–12"],
["Back","Lat Pulldown","Cable Machine","Lats, Biceps","Pull","Grip the bar slightly wider than shoulder width. Pull toward your upper chest while keeping your torso controlled.","3 x 8–12"],
["Back","Seated Cable Row","Cable Machine","Back, Biceps","Pull","Sit tall, brace your core and pull the handle toward your stomach. Squeeze your shoulder blades together.","3 x 8–12"],
["Back","Assisted Pull-Up","Machine","Lats, Biceps","Pull","Choose assistance, grip the handles and pull your chest upward. Lower slowly without dropping.","3 x 6–10"],
["Shoulders","Shoulder Press Machine","Machine","Shoulders, Triceps","Push","Adjust the seat so handles start around ear level. Press upward without arching your lower back.","3 x 8–12"],
["Shoulders","Cable Lateral Raise","Cable","Side Delts","Raise","Stand tall and raise the handle out to your side until roughly shoulder height. Lower slowly.","3 x 12–15"],
["Biceps","Biceps Curl Machine","Machine","Biceps","Curl","Set the seat so elbows line up with the machine pivot. Curl without lifting your shoulders, then control the return.","3 x 10–15"],
["Biceps","Dumbbell Curl","Dumbbells","Biceps","Curl","Stand tall with elbows close to your sides. Curl the dumbbells while keeping your upper arms still.","3 x 8–12"],
["Triceps","Triceps Pushdown","Cable Machine","Triceps","Push","Keep elbows tucked. Push the bar or rope down until arms are straight, then return slowly.","3 x 10–15"],
["Triceps","Triceps Dip Machine","Machine","Triceps, Chest","Push","Adjust assistance and grip the bars. Lower under control, then press back up while keeping shoulders stable.","3 x 8–12"],
["Legs","Leg Press","Machine","Quads, Glutes","Push","Place feet comfortably on the platform. Lower the weight with knees tracking over toes, then press through your feet.","3 x 8–12"],
["Legs","Leg Extension","Machine","Quads","Extend","Align your knees with the machine pivot. Extend your legs smoothly, pause briefly, then lower under control.","3 x 10–15"],
["Legs","Leg Curl","Machine","Hamstrings","Curl","Align your knees with the pivot. Curl the pad toward you without lifting your hips, then slowly return.","3 x 10–15"],
["Glutes","Glute Kickback Machine","Machine","Glutes","Kickback","Brace your core and place your leg against the pad. Drive the leg backward using your glute, then return slowly.","3 x 10–15"],
["Calves","Seated Calf Raise","Machine","Calves","Raise","Place the balls of your feet on the platform. Lower your heels for a stretch, then drive through your toes.","3 x 12–20"],
["Abs","Ab Crunch Machine","Machine","Abs","Crunch","Adjust the seat and brace your feet. Curl your upper body forward using your abs rather than pulling with your arms.","3 x 10–15"],
["Abs","Cable Crunch","Cable Machine","Abs","Crunch","Kneel facing the cable. Hold the rope near your head and crunch your ribs toward your hips.","3 x 10–15"],
["Full Body","Smith Machine Squat","Smith Machine","Quads, Glutes, Core","Squat","Set the bar comfortably across your upper back. Squat down with knees tracking over toes, then stand tall.","3 x 8–12"]
];
let fav=JSON.parse(localStorage.getItem("gymguideFav")||"[]"), current=null, workout=JSON.parse(localStorage.getItem("gymguideWorkout")||"[]"), filter="All";

const parts=["All","Chest","Back","Shoulders","Biceps","Triceps","Legs","Glutes","Calves","Abs","Full Body"];
function home(){filter="All";render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=exercises.filter(e=>(filter==="All"||e[0]===filter)&&e.join(" ").toLowerCase().includes(q));
 document.getElementById("content").innerHTML=`
 <div class="section-title"><h2>Body part</h2><span class="count">${list.length} exercises</span></div>
 <div class="chips">${parts.map(p=>`<button class="chip ${filter===p?'active':''}" onclick="filter='${p}';render()">${p}</button>`).join("")}</div>
 <div class="section-title"><h2>Exercises</h2></div>
 <div class="grid">${list.map((e,i)=>card(e,exercises.indexOf(e))).join("")}</div>`;
}
function card(e,i){return `<article class="card"><button class="star" onclick="toggleFav(${i});event.stopPropagation()">${fav.includes(i)?"★":"☆"}</button><div class="demo"><div class="floor"></div><div class="person"><div class="head"></div><div class="bodyline"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div></div><div class="cardbody" onclick="openExercise(${i})"><h3>${e[1]}</h3><div class="meta">${e[2]} • ${e[3]}</div><span class="tag">${e[6]}</span></div></article>`}
function toggleFav(i){fav.includes(i)?fav=fav.filter(x=>x!==i):fav.push(i);localStorage.setItem("gymguideFav",JSON.stringify(fav));render()}
function showFavourites(){const list=fav.map(i=>exercises[i]).filter(Boolean);document.getElementById("content").innerHTML=`<div class="section-title"><h2>⭐ Your favourites</h2><span class="count">${list.length}</span></div><div class="grid">${list.length?list.map(e=>card(e,exercises.indexOf(e))).join(""):`<div class="empty">No favourites yet.<br>Tap ☆ on an exercise to save it.</div>`}</div>`}
function openExercise(i){current=i;const e=exercises[i];document.getElementById("modalContent").innerHTML=`<div class="demo" style="border-radius:16px;margin-top:8px"><div class="floor"></div><div class="person"><div class="head"></div><div class="bodyline"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div></div><h2>${e[1]}</h2><div class="meta">${e[2]} • ${e[3]} • ${e[6]}</div><h3>How to do it</h3><ol class="steps">${e[5].split(". ").filter(Boolean).map(x=>`<li>${x}${x.endsWith(".")?"":"."}</li>`).join("")}</ol><h3>Log your weight</h3><div class="log"><input id="weight" type="number" inputmode="decimal" placeholder="kg"><input id="reps" type="number" inputmode="numeric" placeholder="reps"><button class="add" onclick="addSet()">Add set</button></div><div id="sets" class="sets">${setsFor(i)}</div><button class="add" style="width:100%;margin-top:14px" onclick="addWorkout(${i})">＋ Add exercise to workout</button>`;document.getElementById("modal").classList.add("show")}
function setsFor(i){const s=workout.filter(x=>x.i===i);return s.map((x,n)=>`<div class="setrow"><span>Set ${n+1}</span><span>${x.w} kg × ${x.r}</span></div>`).join("")||'<div class="meta">No sets logged yet.</div>'}
function addSet(){const w=parseFloat(document.getElementById("weight").value),r=parseInt(document.getElementById("reps").value);if(!w||!r)return;workout.push({i:current,w,r});localStorage.setItem("gymguideWorkout",JSON.stringify(workout));document.getElementById("sets").innerHTML=setsFor(current);document.getElementById("weight").value="";document.getElementById("reps").value=""}
function addWorkout(i){if(!workout.some(x=>x.i===i)){workout.push({i,w:0,r:0});localStorage.setItem("gymguideWorkout",JSON.stringify(workout))}alert("Added to your workout!")}
function showWorkout(){const ids=[...new Set(workout.map(x=>x.i))];document.getElementById("content").innerHTML=`<div class="section-title"><h2>📋 My workout</h2><span class="count">${ids.length} exercises</span></div>${ids.length?ids.map(i=>`<div class="card" style="margin-bottom:10px"><div class="cardbody"><h3>${exercises[i][1]}</h3><div class="meta">${exercises[i][3]}</div><button class="add" style="margin-top:10px" onclick="openExercise(${i})">Open & log</button></div></div>`).join(""):`<div class="empty">Your workout is empty.<br>Add exercises from the exercise library.</div>`}`}
function closeModal(){document.getElementById("modal").classList.remove("show")}
render();
</script>
</body>
</html>
